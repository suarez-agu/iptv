name: Update IPTV mirror

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Download IPTV-org and patch El Trece
        run: python update.py

      - name: Commit updated playlist
        shell: bash
        run: |
          git add docs/index.country.m3u

          if git diff --cached --quiet -- docs/index.country.m3u; then
            echo "Playlist has not changed."
            exit 0
          fi

          git config user.name "iptv-mirror-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update IPTV mirror"
          git push
